name: VoiceBook Studio Tests

on:
  pull_request:
    paths:
      - "app/audiobook_server/**"
      - "app/requirements-audiobook.txt"
      - ".github/workflows/audiobook-studio-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-audiobook.txt pytest
      - name: Run backend unit tests
        env:
          PYTHONPATH: app
        run: pytest -q app/audiobook_server/tests
